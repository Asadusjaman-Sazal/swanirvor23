name: Release APK

# Comment: Publishing a release is what the in-app "Check for Update" button reads. Push a tag that
# matches the "Current Version" line in versionHistory.txt (for example v1.0.24) and this workflow
# builds the signed APK and attaches it to a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Comment: contents: write is needed for the built-in GITHUB_TOKEN to create the release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source for this tag
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle with build caching
        uses: gradle/actions/setup-gradle@v4

      # Comment: The release keystore is never committed (see .gitignore). It is stored once as a
      # base64 repo secret and written to the runner's temp directory for this build only.
      - name: Restore the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > signing/release.jks

      # Comment: app/build.gradle.kts reads SUPABASE_* and the signing secrets through .env (the
      # project convention) or matching environment variables, so the same keys work in CI.
      - name: Write the .env the build expects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ANON_KEY" ] && missing="$missing SUPABASE_ANON_KEY"
          [ -z "$STORE_PASSWORD" ] && missing="$missing STORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing"
            exit 1
          fi
          cat > .env <<EOF
          SUPABASE_URL="$SUPABASE_URL"
          SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          KEYSTORE_PATH="$GITHUB_WORKSPACE/signing/release.jks"
          STORE_PASSWORD="$STORE_PASSWORD"
          KEY_ALIAS="$KEY_ALIAS"
          KEY_PASSWORD="$KEY_PASSWORD"
          EOF

      # Comment: Guard against a tag that disagrees with versionHistory.txt — the in-app update check
      # compares the release tag with BuildConfig.VERSION_NAME, so a mismatch would ship a bad prompt.
      - name: Verify the tag matches versionHistory.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          current=$(grep -m1 '^Current Version:' versionHistory.txt | cut -d' ' -f3 | tr -d '\r\n ')
          tag="${GITHUB_REF_NAME#v}"
          echo "versionHistory: $current / tag: $tag"
          if [ "$current" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Current Version $current in versionHistory.txt."
            exit 1
          fi

      - name: Build the signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swanirvor23-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Comment: gh is preinstalled on GitHub runners, so no third-party release action is required.
      - name: Publish the GitHub Release with the APK attached
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "swanirvor23-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" \
            "swanirvor23-${GITHUB_REF_NAME}.apk" \
            --title "Swanirvor-23 ${GITHUB_REF_NAME}" \
            --generate-notes
